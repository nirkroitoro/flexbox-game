<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Soccer Flexbox Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Soccer Flexbox Game</h1>
      <p class="level-indicator" id="level-indicator">Level 1 of 10</p>
      <nav class="level-nav" id="level-nav">
        <button type="button" class="btn btn-nav" id="prev-level-btn">Prev</button>
        <div class="level-dots" id="level-dots"></div>
        <button type="button" class="btn btn-nav" id="next-level-btn">Next</button>
      </nav>
    </header>

    <main class="main">
      <section class="panel instructions-panel">
        <h2>Orders</h2>
        <p id="instruction" class="instruction"></p>
        <p class="attempts">Attempts: <span id="attempts">0</span></p>
      </section>

      <section class="panel pitch-panel">
        <div class="pitch-wrapper">
          <div class="goal goal-top">
            <span class="goal-post goal-post-left"></span>
            <span class="goal-crossbar"></span>
            <span class="goal-post goal-post-right"></span>
            <span class="goal-net"></span>
          </div>
          <div class="goal goal-bottom">
            <span class="goal-post goal-post-left"></span>
            <span class="goal-crossbar"></span>
            <span class="goal-post goal-post-right"></span>
            <span class="goal-net"></span>
          </div>
          <div id="pitch" class="pitch">
            <div id="pitch-field" class="pitch-field"></div>
          </div>
          <div id="celebration" class="celebration" hidden>
            <div class="celebration-stage">
              <div class="legend legend-messi">
                <div class="legend-head"></div>
                <div class="legend-body">
                  <span class="legend-number">10</span>
                </div>
                <div class="legend-legs"></div>
                <span class="legend-name">Messi</span>
              </div>
              <div class="legend legend-ronaldo">
                <div class="legend-head"></div>
                <div class="legend-body">
                  <span class="legend-number">7</span>
                </div>
                <div class="legend-legs"></div>
                <span class="legend-name">Ronaldo</span>
              </div>
              <div class="celebration-ball">⚽</div>
            </div>
            <p class="celebration-cheer">GOAL! Legends approve!</p>
          </div>
        </div>
      </section>

      <section class="panel controls-panel">
        <h2>Tactics Board</h2>
        <p class="controls-hint">Click a button to set each flex property.</p>

        <div class="control-group">
          <span class="control-label">flex-direction</span>
          <div class="button-row" id="controls-flexDirection"></div>
        </div>

        <div class="control-group">
          <span class="control-label">justify-content</span>
          <div class="button-row" id="controls-justifyContent"></div>
        </div>

        <div class="control-group">
          <span class="control-label">align-items</span>
          <div class="button-row" id="controls-alignItems"></div>
        </div>

        <div class="control-group">
          <span class="control-label">flex-wrap</span>
          <div class="button-row" id="controls-flexWrap"></div>
        </div>
      </section>

      <section class="panel actions-panel">
        <button type="button" class="btn btn-primary" id="check-btn">Check Formation</button>
        <button type="button" class="btn btn-hint" id="discover-btn">Discover Result</button>
        <button type="button" class="btn btn-secondary" id="reset-btn">Reset Level</button>
        <button type="button" class="btn btn-success" id="next-btn" hidden>Next Level</button>
      </section>

      <div id="solution-panel" class="solution-panel" hidden>
        <h3>Correct formation</h3>
        <ul id="solution-list" class="solution-list"></ul>
      </div>

      <div id="feedback" class="feedback" role="status"></div>
    </main>

    <footer class="footer">
      <p>Practice CSS Flexbox on the soccer pitch.</p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
